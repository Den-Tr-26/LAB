<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>CreativePortfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header class="site-header-inner">
        <div class="header-container">
            <div class="logo">Creative<span>Portfolio</span></div>
            <nav>
                <a href="index.html">Головна</a>
                <a href="portfolio.html">Портфоліо</a>
                <a href="blog.html">Блог</a>
                <a href="contact.html" class="active">Контакти</a>
            </nav>
        </div>
    </header>

    
    <main class="main-contact">
        <h1>Зв'яжіться зі мною</h1>

        <div class="contact-form-wrapper">
            <form action="#" method="POST">
                
                <div class="form-group">
                    <label for="name">Ім'я *</label>
                    <input type="text" id="name" name="name" placeholder="Введіть ваше ім'я" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Тема</label>
                    <select id="subject" name="subject">
                        <option value="general">Загальне питання</option>
                        <option value="project">Замовлення проєкту</option>
                        <option value="cooperation">Співпраця</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Повідомлення *</label>
                    <textarea id="message" name="message" rows="5" placeholder="Ваше повідомлення..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Надіслати</button>

            </form>
        </div>
    </main>

    
    <footer class="site-footer">
        <p>&copy; 2026 CreativePortfolio | <a href="#">Facebook</a> <a href="#">GitHub</a> <a href="#">LinkedIn</a></p>
    </footer>

</body>
</html>
